<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Scan - LiDAR Trail Mapper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #06b6d4;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        header {
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 1.5rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 600;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .status-indicator.disconnected {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .status-indicator.connecting {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .status-indicator.connected {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .status-indicator.connecting .status-dot {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 13px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--bg-hover);
            border-color: var(--primary);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-danger {
            background: var(--error);
            border: none;
            color: white;
        }

        .nav-link {
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 13px;
            transition: all 0.2s;
        }

        .nav-link:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            position: relative;
        }

        /* 3D Viewer */
        #canvas-container {
            flex: 1;
            position: relative;
            background: linear-gradient(180deg, #0a0f1a 0%, #111827 100%);
        }

        /* Side Panel */
        .side-panel {
            width: 320px;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--bg-dark);
        }

        .side-panel::-webkit-scrollbar {
            width: 8px;
        }

        .side-panel::-webkit-scrollbar-track {
            background: var(--bg-dark);
            border-radius: 4px;
        }

        .side-panel::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .side-panel::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        .panel-section {
            background: var(--bg-dark);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid var(--border);
        }

        .panel-section h3 {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-grid {
            display: grid;
            gap: 8px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .stat-value {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 13px;
        }

        .stat-value.live {
            color: var(--success);
        }

        /* Scan Controls */
        .scan-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .scan-controls .btn {
            width: 100%;
            justify-content: center;
            padding: 12px;
        }

        /* Settings */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .setting-row label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .setting-row input[type="number"] {
            width: 80px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 13px;
        }

        .setting-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        /* Log Console */
        .log-console {
            background: #000;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 2px 0;
            color: var(--text-secondary);
        }

        .log-entry.info {
            color: var(--accent);
        }

        .log-entry.success {
            color: var(--success);
        }

        .log-entry.error {
            color: var(--error);
        }

        .log-entry.warning {
            color: var(--warning);
        }

        /* Overlay Messages */
        .overlay-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 40px;
        }

        .overlay-message h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .overlay-message p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        /* Progress bar */
        .progress-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div class="header-left">
                <a href="index.html" class="logo">
                    <div class="logo-icon">L2</div>
                    <div class="logo-text">Live Scan</div>
                </a>
                <div class="status-indicator disconnected" id="status-indicator">
                    <span class="status-dot"></span>
                    <span id="status-text">Disconnected</span>
                </div>
            </div>
            <div class="header-right">
                <a href="index.html" class="nav-link">&#x1F3E0; Home</a>
                <a href="viewer.html" class="nav-link">&#x1F4F7; Viewer</a>
            </div>
        </header>

        <div class="main-content">
            <div id="canvas-container">
                <div class="overlay-message" id="connect-overlay">
                    <h2>&#x1F4E1; Live LiDAR Streaming</h2>
                    <p>Connect to the LiDAR sensor to start streaming point cloud data in real-time.</p>
                    <button class="btn btn-primary" id="connect-btn" onclick="startScanning()">
                        &#x25B6; Start Scanning
                    </button>
                </div>
            </div>

            <div class="side-panel">
                <div class="panel-section">
                    <h3>&#x1F4CA; Live Statistics</h3>
                    <div class="stat-grid">
                        <div class="stat-item">
                            <span class="stat-label">Total Points</span>
                            <span class="stat-value live" id="stat-points">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Scans</span>
                            <span class="stat-value" id="stat-scans">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">FPS</span>
                            <span class="stat-value" id="stat-fps">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Duration</span>
                            <span class="stat-value" id="stat-duration">0:00</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Loop Closures</span>
                            <span class="stat-value" id="stat-loops">0</span>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>&#x1F3AE; Controls</h3>
                    <div class="scan-controls">
                        <button class="btn btn-primary" id="start-btn" onclick="startScanning()" disabled>
                            &#x25B6; Start Scan
                        </button>
                        <button class="btn btn-danger" id="stop-btn" onclick="stopScanning()" disabled>
                            &#x23F9; Stop Scan
                        </button>
                        <button class="btn" id="save-btn" onclick="saveScan()" disabled>
                            &#x1F4BE; Save Scan
                        </button>
                        <button class="btn" id="clear-btn" onclick="clearScan()">
                            &#x1F5D1; Clear
                        </button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>&#x2699; Settings</h3>
                    <div class="setting-row">
                        <label>Duration (sec)</label>
                        <input type="number" id="duration" value="60" min="10" max="300">
                    </div>
                    <div class="setting-row">
                        <label>Voxel Size (m)</label>
                        <input type="number" id="voxel-size" value="0.05" min="0.01" max="0.5" step="0.01">
                    </div>
                    <div class="setting-row">
                        <label>Loop Closure</label>
                        <input type="checkbox" id="loop-closure" checked>
                    </div>
                    <div class="setting-row">
                        <label>IMU Deskew</label>
                        <input type="checkbox" id="imu-deskew" checked>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>&#x1F3A5; Camera</h3>
                    <div class="setting-row">
                        <label>Fixed Camera</label>
                        <input type="checkbox" id="fixed-camera" onchange="toggleFixedCamera()">
                    </div>
                    <div class="setting-row">
                        <label>Auto-Rotate</label>
                        <input type="checkbox" id="auto-rotate" onchange="toggleAutoRotate()">
                    </div>
                    <div class="setting-row">
                        <label>Follow Position</label>
                        <input type="checkbox" id="follow-position" onchange="toggleFollowPosition()">
                    </div>
                    <div class="setting-row">
                        <label>Show Trajectory</label>
                        <input type="checkbox" id="show-trajectory" checked onchange="toggleTrajectory()">
                    </div>
                    <div class="setting-row">
                        <label>Point Size</label>
                        <input type="number" id="point-size" value="0.02" min="0.005" max="0.1" step="0.005" onchange="updatePointSize()">
                    </div>
                    <div class="scan-controls" style="margin-top: 10px;">
                        <button class="btn" onclick="resetCamera()">&#x1F3AF; Reset Camera</button>
                        <button class="btn" onclick="setTopView()">&#x2B06; Top View</button>
                        <button class="btn" onclick="setSideView()">&#x27A1; Side View</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>&#x1F4DD; Log</h3>
                    <div class="log-console" id="log-console">
                        <div class="log-entry">Ready to connect...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Global state
        let scene, camera, renderer, controls;
        let pointCloud = null;
        let allPoints = [];
        let isScanning = false;
        let ws = null;
        let startTime = null;
        let frameCount = 0;
        let lastFpsTime = Date.now();
        let fixedCamera = false;
        let followPosition = false;  // Default OFF - prevents spinning (Point-LIO approach)
        let lastPosition = [0, 0, 0];
        let cameraTarget = new THREE.Vector3(0, 0, 0);

        // Point-LIO inspired: Gravity-aligned world frame
        // The world frame is fixed with Z pointing up (gravity-aligned)
        // This prevents jarring camera rotations during scanning
        let worldFrameInitialized = false;
        let gravityAlignTransform = new THREE.Matrix4();  // Transform to gravity-aligned frame

        // Pose interpolation for smooth transitions (from Point-LIO)
        let currentPose = { x: 0, y: 0, z: 0 };
        let targetPose = { x: 0, y: 0, z: 0 };
        const POSE_LERP_FACTOR = 0.05;  // Smooth interpolation (lower = smoother)

        // Trajectory visualization
        let trajectoryLine = null;
        let trajectoryPoints = [];
        const MAX_TRAJECTORY_POINTS = 1000;

        // Initialize Three.js
        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1a);

            camera = new THREE.PerspectiveCamera(
                60,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(5, 5, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = false;
            controls.autoRotateSpeed = 1.0;

            // Add grid
            const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
            scene.add(grid);

            // Add axes
            const axes = new THREE.AxesHelper(2);
            scene.add(axes);

            // Add lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);

            // Initialize trajectory line (Point-LIO style path visualization)
            const trajectoryGeometry = new THREE.BufferGeometry();
            const trajectoryMaterial = new THREE.LineBasicMaterial({
                color: 0x22c55e,  // Green trajectory like RViz
                linewidth: 2
            });
            trajectoryLine = new THREE.Line(trajectoryGeometry, trajectoryMaterial);
            scene.add(trajectoryLine);

            // Add current position marker
            const markerGeometry = new THREE.SphereGeometry(0.1, 16, 16);
            const markerMaterial = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            window.positionMarker = new THREE.Mesh(markerGeometry, markerMaterial);
            scene.add(window.positionMarker);

            // Resize handler
            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Point-LIO inspired: Smooth pose interpolation
            // This prevents jarring camera movements by gradually moving to target
            if (followPosition && !fixedCamera) {
                currentPose.x += (targetPose.x - currentPose.x) * POSE_LERP_FACTOR;
                currentPose.y += (targetPose.y - currentPose.y) * POSE_LERP_FACTOR;
                currentPose.z += (targetPose.z - currentPose.z) * POSE_LERP_FACTOR;

                // Update camera target smoothly
                cameraTarget.set(currentPose.x, currentPose.y, currentPose.z);
                controls.target.copy(cameraTarget);
            }

            // Update position marker
            if (window.positionMarker) {
                window.positionMarker.position.set(currentPose.x, currentPose.y, currentPose.z);
            }

            controls.update();
            renderer.render(scene, camera);

            // Update FPS
            frameCount++;
            const now = Date.now();
            if (now - lastFpsTime >= 1000) {
                document.getElementById('stat-fps').textContent = frameCount;
                frameCount = 0;
                lastFpsTime = now;
            }

            // Update duration
            if (isScanning && startTime) {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const mins = Math.floor(elapsed / 60);
                const secs = elapsed % 60;
                document.getElementById('stat-duration').textContent =
                    `${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }

        function updatePointCloud(newPoints) {
            // Add new points to our collection
            allPoints.push(...newPoints);

            // Remove old point cloud
            if (pointCloud) {
                scene.remove(pointCloud);
                pointCloud.geometry.dispose();
                pointCloud.material.dispose();
            }

            // Create new point cloud
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(allPoints.length * 3);
            const colors = new Float32Array(allPoints.length * 3);

            // Find height range for coloring
            let minZ = Infinity, maxZ = -Infinity;
            for (let i = 0; i < allPoints.length; i++) {
                const z = allPoints[i][2];
                minZ = Math.min(minZ, z);
                maxZ = Math.max(maxZ, z);
            }
            const zRange = maxZ - minZ || 1;

            for (let i = 0; i < allPoints.length; i++) {
                positions[i * 3] = allPoints[i][0];
                positions[i * 3 + 1] = allPoints[i][2]; // Y is up in Three.js
                positions[i * 3 + 2] = -allPoints[i][1];

                // Color by height (blue to red)
                const t = (allPoints[i][2] - minZ) / zRange;
                colors[i * 3] = t;
                colors[i * 3 + 1] = 0.2;
                colors[i * 3 + 2] = 1 - t;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.02,
                vertexColors: true
            });

            pointCloud = new THREE.Points(geometry, material);
            scene.add(pointCloud);

            // Update stats
            document.getElementById('stat-points').textContent =
                allPoints.length.toLocaleString();
        }

        function log(message, type = '') {
            const console = document.getElementById('log-console');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            console.appendChild(entry);
            console.scrollTop = console.scrollHeight;
        }

        function setStatus(status, text) {
            const indicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');
            indicator.className = 'status-indicator ' + status;
            statusText.textContent = text;
        }

        function startScanning() {
            const duration = parseInt(document.getElementById('duration').value);
            const voxelSize = parseFloat(document.getElementById('voxel-size').value);
            const loopClosure = document.getElementById('loop-closure').checked;
            const imuDeskew = document.getElementById('imu-deskew').checked;

            // Hide overlay
            document.getElementById('connect-overlay').style.display = 'none';

            setStatus('connecting', 'Connecting...');
            log('Connecting to LiDAR stream server...', 'info');

            // Connect to WebSocket server
            const wsUrl = `ws://localhost:8765`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                setStatus('connected', 'Connected');
                log('Connected to stream server', 'success');

                // Send start command with settings
                ws.send(JSON.stringify({
                    command: 'start',
                    duration: duration,
                    voxel_size: voxelSize,
                    loop_closure: loopClosure,
                    imu_deskew: imuDeskew
                }));

                isScanning = true;
                startTime = Date.now();

                document.getElementById('start-btn').disabled = true;
                document.getElementById('stop-btn').disabled = false;
                document.getElementById('save-btn').disabled = true;

                log(`Starting scan (${duration}s, voxel=${voxelSize}m)`, 'info');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'points') {
                    updatePointCloud(data.points);
                    document.getElementById('stat-scans').textContent = data.scan_count;

                    // Point-LIO inspired: Update target pose for smooth interpolation
                    // The actual interpolation happens in animate() for smooth 60fps updates
                    if (data.position) {
                        lastPosition = data.position;
                        // Set target pose (interpolated in animate loop)
                        // Convert from LiDAR coords (X forward, Y left, Z up) to Three.js (Y up)
                        targetPose.x = data.position[0];
                        targetPose.y = data.position[2];  // Z becomes Y (up)
                        targetPose.z = -data.position[1]; // Y becomes -Z

                        // Update trajectory (Point-LIO path visualization)
                        updateTrajectory(targetPose.x, targetPose.y, targetPose.z);
                    }

                    if (data.loop_closure) {
                        const loops = parseInt(document.getElementById('stat-loops').textContent) + 1;
                        document.getElementById('stat-loops').textContent = loops;
                        log(`Loop closure detected! (scan ${data.scan_count})`, 'success');
                    }
                } else if (data.type === 'status') {
                    log(data.message, data.level || 'info');
                } else if (data.type === 'complete') {
                    log('Scan complete!', 'success');
                    isScanning = false;
                    document.getElementById('start-btn').disabled = false;
                    document.getElementById('stop-btn').disabled = true;
                    document.getElementById('save-btn').disabled = false;
                } else if (data.type === 'error') {
                    log(data.message, 'error');
                    setStatus('disconnected', 'Error');
                }
            };

            ws.onerror = (error) => {
                log('WebSocket error - is the stream server running?', 'error');
                log('Run: python web/stream_server.py', 'warning');
                setStatus('disconnected', 'Error');
            };

            ws.onclose = () => {
                if (isScanning) {
                    log('Connection closed', 'warning');
                    setStatus('disconnected', 'Disconnected');
                }
                isScanning = false;
                document.getElementById('start-btn').disabled = false;
                document.getElementById('stop-btn').disabled = true;
            };
        }

        function stopScanning() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: 'stop' }));
                log('Stopping scan...', 'warning');
            }
            isScanning = false;
            document.getElementById('start-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('save-btn').disabled = false;
        }

        function saveScan() {
            if (allPoints.length === 0) {
                log('No points to save', 'warning');
                return;
            }

            // Create JSON for download
            const vertices = [];
            for (const p of allPoints) {
                vertices.push(p[0], p[1], p[2]);
            }

            const data = {
                vertices: vertices,
                faces: [],
                scan_info: {
                    points: allPoints.length,
                    timestamp: new Date().toISOString()
                }
            };

            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `live_scan_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);

            log(`Saved ${allPoints.length.toLocaleString()} points`, 'success');
        }

        // Point-LIO inspired: Trajectory visualization (like RViz /path topic)
        function updateTrajectory(x, y, z) {
            trajectoryPoints.push(new THREE.Vector3(x, y, z));

            // Limit trajectory length
            if (trajectoryPoints.length > MAX_TRAJECTORY_POINTS) {
                trajectoryPoints.shift();
            }

            // Update line geometry
            if (trajectoryLine && trajectoryPoints.length >= 2) {
                const positions = new Float32Array(trajectoryPoints.length * 3);
                for (let i = 0; i < trajectoryPoints.length; i++) {
                    positions[i * 3] = trajectoryPoints[i].x;
                    positions[i * 3 + 1] = trajectoryPoints[i].y;
                    positions[i * 3 + 2] = trajectoryPoints[i].z;
                }
                trajectoryLine.geometry.setAttribute(
                    'position',
                    new THREE.BufferAttribute(positions, 3)
                );
                trajectoryLine.geometry.setDrawRange(0, trajectoryPoints.length);
            }
        }

        function clearScan() {
            allPoints = [];
            if (pointCloud) {
                scene.remove(pointCloud);
                pointCloud.geometry.dispose();
                pointCloud.material.dispose();
                pointCloud = null;
            }

            // Clear trajectory
            trajectoryPoints = [];
            if (trajectoryLine) {
                trajectoryLine.geometry.setAttribute(
                    'position',
                    new THREE.BufferAttribute(new Float32Array(0), 3)
                );
            }

            // Reset pose tracking
            currentPose = { x: 0, y: 0, z: 0 };
            targetPose = { x: 0, y: 0, z: 0 };
            lastPosition = [0, 0, 0];
            cameraTarget.set(0, 0, 0);

            // Reset position marker
            if (window.positionMarker) {
                window.positionMarker.position.set(0, 0, 0);
            }

            document.getElementById('stat-points').textContent = '0';
            document.getElementById('stat-scans').textContent = '0';
            document.getElementById('stat-loops').textContent = '0';
            document.getElementById('stat-duration').textContent = '0:00';
            log('Cleared point cloud and trajectory', 'info');
        }

        // Camera control functions
        function toggleFixedCamera() {
            fixedCamera = document.getElementById('fixed-camera').checked;
            controls.enabled = !fixedCamera;
            if (fixedCamera) {
                log('Camera fixed - pan/rotate disabled', 'info');
            } else {
                log('Camera controls enabled', 'info');
            }
        }

        function toggleAutoRotate() {
            controls.autoRotate = document.getElementById('auto-rotate').checked;
            if (controls.autoRotate) {
                log('Auto-rotate enabled', 'info');
            } else {
                log('Auto-rotate disabled', 'info');
            }
        }

        function toggleFollowPosition() {
            followPosition = document.getElementById('follow-position').checked;
            if (followPosition) {
                log('Camera will follow scan position (smooth interpolation)', 'info');
            } else {
                log('Camera target fixed in world frame', 'info');
            }
        }

        function toggleTrajectory() {
            const show = document.getElementById('show-trajectory').checked;
            if (trajectoryLine) {
                trajectoryLine.visible = show;
            }
            if (window.positionMarker) {
                window.positionMarker.visible = show;
            }
            log(show ? 'Trajectory visible' : 'Trajectory hidden', 'info');
        }

        function updatePointSize() {
            const size = parseFloat(document.getElementById('point-size').value);
            if (pointCloud && pointCloud.material) {
                pointCloud.material.size = size;
                log(`Point size set to ${size}`, 'info');
            }
        }

        function resetCamera() {
            camera.position.set(5, 5, 5);
            controls.target.set(0, 0, 0);
            cameraTarget.set(0, 0, 0);
            controls.update();
            log('Camera reset to default position', 'info');
        }

        function setTopView() {
            camera.position.set(0, 15, 0);
            controls.target.copy(cameraTarget);
            controls.update();
            log('Top view activated', 'info');
        }

        function setSideView() {
            camera.position.set(15, 2, 0);
            controls.target.copy(cameraTarget);
            controls.update();
            log('Side view activated', 'info');
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            initThree();
            log('3D viewer initialized', 'success');
            log('Click "Start Scanning" to begin', 'info');

            // Enable start button
            document.getElementById('start-btn').disabled = false;
        });
    </script>
</body>
</html>
